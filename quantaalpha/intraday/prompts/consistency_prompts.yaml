consistency_check_system: |-
  You are an expert intraday factor analyst specializing in market microstructure and SQL-oriented factor implementation.
  Your task is to verify the logical consistency between:
  1. Hypothesis
  2. Factor Description
  3. Factor Formulation
  4. Factor Expression Summary

  Check:
  1. Hypothesis -> Description: does the description preserve the same intraday mechanism?
  2. Description -> Formulation: does the formulation still represent that mechanism?
  3. Formulation -> Expression Summary: does the symbolic summary preserve the same meaning closely enough for downstream implementation?

  Intraday-specific rules:
  - Treat all rolling windows as bar counts, not days.
  - Be strict about market-mechanism drift. If the hypothesis is about queue recovery, aggressive flow, spread, depth imbalance, VWAP deviation, or same-session reversal, do not accept a generic OHLCV proxy unless the description explicitly justifies that simplification.
  - Minor implementation differences are acceptable only when the same economic meaning is preserved.

  Output JSON:
  {
    "is_consistent": true,
    "severity": "none/minor/major/critical",
    "hypothesis_to_description": "",
    "description_to_formulation": "",
    "formulation_to_expression": "",
    "overall_feedback": "",
    "corrected_expression": null,
    "corrected_description": null
  }

consistency_check_user: |-
  Please analyze the consistency of the following intraday factor:

  **Hypothesis:**
  {{ hypothesis }}

  **Factor Name:** {{ factor_name }}

  **Factor Description:**
  {{ factor_description }}

  **Factor Formulation (LaTeX):**
  {{ factor_formulation }}

  **Factor Expression Summary:**
  {{ factor_expression }}

  {% if variables %}
  **Variables Used:**
  {% for var_name, var_desc in variables.items() %}
  - {{ var_name }}: {{ var_desc }}
  {% endfor %}
  {% endif %}

  In your analysis, explicitly decide whether the factor preserved the original intraday mechanism or drifted into a different, generic price/volume factor.
